name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - name: Tests
        run: python -m pytest tests/ -q
      - name: Plugin loads and registers
        run: python -c "import sys; sys.path.insert(0, '..'); import leash; assert callable(leash.register)"
